<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brunch Recipes</title>
  <link rel="stylesheet" href="category.css">
</head>
<body>
  <a href="home.html" class="back-button">← Back to Home</a>
  <h1>🥐 Brunch Recipes</h1>
  <div id="recipe-container"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { firebaseConfig } from './cred.js';

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function deleteRecipe(docId, recipeCard) {
      if (confirm('Are you sure you want to delete this recipe?')) {
        try {
          recipeCard.classList.add('deleting');
          await deleteDoc(doc(db, "savedrecipes", docId));
          
          setTimeout(() => {
            recipeCard.remove();
            checkIfEmpty();
          }, 500);
          
        } catch (error) {
          console.error("Error deleting recipe:", error);
          alert('Error deleting recipe. Please try again.');
          recipeCard.classList.remove('deleting');
        }
      }
    }

    function checkIfEmpty() {
      const container = document.getElementById("recipe-container");
      const cards = container.querySelectorAll('.recipe-card');
      if (cards.length === 0) {
        container.innerHTML = '<p class="empty-message">No brunch recipes found.</p>';
      }
    }

    async function fetchBrunchRecipes() {
      const recipeContainer = document.getElementById("recipe-container");
      recipeContainer.innerHTML = '<p class="loading-message">🔄 Loading delicious brunch recipes...</p>';

      try {
        // Query recipes where category == 'brunch'
        const q = query(collection(db, "savedrecipes"), where("category", "==", "brunch"));
        const querySnapshot = await getDocs(q);

        recipeContainer.innerHTML = ""; // Clear loading

        if (querySnapshot.empty) {
          recipeContainer.innerHTML = '<p class="empty-message">No brunch recipes found.</p>';
          return;
        }

        querySnapshot.forEach((docSnapshot) => {
          const recipe = docSnapshot.data();
          const docId = docSnapshot.id;
          const ingredients = Array.isArray(recipe.ingredients)
            ? recipe.ingredients
            : typeof recipe.ingredients === "string"
            ? recipe.ingredients.split("\n").filter(item => item.trim())
            : [];

          const recipeDiv = document.createElement("div");
          recipeDiv.classList.add("recipe-card");

          recipeDiv.innerHTML = `
            <div class="recipe-header">
              <h2>${recipe.dishName || "Untitled Recipe"}</h2>
              <button class="delete-btn" title="Delete Recipe">×</button>
            </div>
            <div class="recipe-content">
              <div class="calories-badge">🔥 ${recipe.calories || "N/A"} Calories</div>
              
              <div class="recipe-details" style="display: none;">
                <div class="info-row">
                  <span class="info-label">🌱 Healthiness:</span>
                  <span class="info-value">${recipe.healthiness || "Unknown"}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">⏰ Prep Time:</span>
                  <span class="info-value">${recipe.prepTime || "?"} mins</span>
                </div>
                
                ${ingredients.length > 0 ? `
                  <h3>📝 Ingredients:</h3>
                  <ul>${ingredients.map(ingredient => `<li>• ${ingredient.trim()}</li>`).join("")}</ul>
                ` : '<p><em>No ingredients listed</em></p>'}
              </div>
              <button class="toggle-btn">Show Details</button>
            </div>
          `;

          recipeContainer.appendChild(recipeDiv);

          // Add delete functionality
          const deleteBtn = recipeDiv.querySelector(".delete-btn");
          deleteBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            deleteRecipe(docId, recipeDiv);
          });

          // Add toggle functionality
          const toggleBtn = recipeDiv.querySelector(".toggle-btn");
          const detailsDiv = recipeDiv.querySelector(".recipe-details");

          toggleBtn.addEventListener("click", () => {
            const isVisible = detailsDiv.style.display === "block";
            detailsDiv.style.display = isVisible ? "none" : "block";
            toggleBtn.textContent = isVisible ? "Show Details" : "Hide Details";
          });
        });

      } catch (error) {
        console.error("Error fetching brunch recipes:", error);
        recipeContainer.innerHTML = '<p class="error-message">❌ Error loading recipes. Please refresh the page.</p>';
      }
    }

    window.onload = fetchBrunchRecipes;
  </script>
</body>
</html>
