<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup - Delish Recipes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- Theme Variables from Delish Recipes --- */
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #e74c3c;
            --accent-color: #f39c12;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --shadow-light: 0 2px 20px rgba(0, 0, 0, 0.08);
            --shadow-medium: 0 4px 25px rgba(0, 0, 0, 0.12);
            --border-radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- Base & Body Styles --- */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        /* --- Main Container --- */
        .auth-container {
            position: relative;
            background-color: var(--bg-primary);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-medium);
            width: 100%;
            max-width: 28rem; /* 448px */
            margin: 1rem;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .auth-container {
                padding: 3rem;
            }
        }

        /* --- Form Visibility Transitions --- */
        .form-container {
            transition: var(--transition);
        }
        .form-hidden {
            opacity: 0;
            transform: scale(0.95);
            position: absolute;
            top: 3rem; 
            left: 3rem;
            right: 3rem;
            pointer-events: none;
        }
        .form-visible {
            opacity: 1;
            transform: scale(1);
            position: static;
        }

        /* --- Typography --- */
        .form-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem; /* 32px */
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .form-subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            text-align: center;
            font-size: 0.95rem;
        }

        /* --- Form Elements --- */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            color: var(--text-primary);
            font-size: 0.875rem; /* 14px */
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        .label-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.85rem 1rem;
            background-color: var(--bg-secondary);
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-sizing: border-box; 
            transition: var(--transition);
            color: var(--text-primary);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(243, 156, 18, 0.3);
            background-color: var(--bg-primary);
        }
        
        /* --- Buttons & Links --- */
        .btn {
            width: 100%;
            color: var(--bg-primary);
            font-weight: 600;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.9rem;
        }
        .btn:focus {
             outline: none;
             box-shadow: 0 0 0 3px var(--bg-primary), 0 0 0 5px var(--accent-color);
        }

        .btn-primary {
            background-color: var(--secondary-color);
        }
        .btn-primary:hover {
            background-color: #c0392b; /* Darker red */
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(231, 76, 60, 0.3);
        }

        .btn-secondary {
            background-color: var(--primary-color);
        }
        .btn-secondary:hover {
            background-color: #212f3d; /* Darker blue/slate */
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(44, 62, 80, 0.3);
        }

        .text-link {
            font-size: 0.875rem; /* 14px */
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 500;
        }
        .text-link:hover {
            text-decoration: underline;
        }

        /* --- Footer --- */
        .form-footer {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 2rem;
        }
        .form-footer a {
            font-weight: 600;
            text-decoration: none;
            color: var(--primary-color);
            transition: var(--transition);
        }
        .form-footer a:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <div class="auth-container">

        <!-- Login Form -->
        <div id="login-form" class="form-container form-visible">
            <h2 class="form-title">Welcome Back!</h2>
            <p class="form-subtitle">Log in to access your Delish Recipes.</p>

            <form>
                <div class="form-group">
                    <label for="login-email" class="form-label">Email Address</label>
                    <input type="email" id="login-email" name="email" class="form-input" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <div class="label-group">
                        <label for="login-password" class="form-label">Password</label>
                        <a href="#" class="text-link">Forgot Password?</a>
                    </div>
                    <input type="password" id="login-password" name="password" class="form-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top: 1.5rem;">
                    Log In
                </button>
            </form>

            <p class="form-footer">
                Don't have an account? <a href="#" id="show-signup">Sign up</a>
            </p>
        </div>

        <!-- Signup Form -->
        <div id="signup-form" class="form-container form-hidden">
            <h2 class="form-title">Create an Account</h2>
            <p class="form-subtitle">Join the Delish Recipes community.</p>

            <form>
                <div class="form-group">
                    <label for="signup-email" class="form-label">Email Address</label>
                    <input type="email" id="signup-email" name="email" class="form-input" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="signup-password" class="form-label">Password</label>
                    <input type="password" id="signup-password" name="password" class="form-input" placeholder="Create a strong password" required>
                </div>
                
                <div class="form-group">
                    <label for="signup-confirm-password" class="form-label">Confirm Password</label>
                    <input type="password" id="signup-confirm-password" name="confirm_password" class="form-input" placeholder="Repeat your password" required>
                </div>

                <button type="submit" class="btn btn-secondary" style="margin-top: 1.5rem;">
                    Sign Up
                </button>
            </form>

            <p class="form-footer">
                Already have an account? <a href="#" id="show-login">Log in</a>
            </p>
        </div>
    </div>

    <script>
        // --- DOM Element References ---
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const showSignupLink = document.getElementById('show-signup');
        const showLoginLink = document.getElementById('show-login');

        /**
         * Toggles the visibility between the login and signup forms.
         * @param {HTMLElement} formToShow - The form element to make visible.
         * @param {HTMLElement} formToHide - The form element to hide.
         */
        function toggleForms(formToShow, formToHide) {
            formToHide.classList.remove('form-visible');
            formToHide.classList.add('form-hidden');
            
            // Wait for the hide transition to finish before showing the new form
            setTimeout(() => {
                formToShow.classList.remove('form-hidden');
                formToShow.classList.add('form-visible');
            }, 150); // Shorter delay for a snappier feel
        }

        // --- Event Listeners ---

        // Event listener for the "Sign up" link
        showSignupLink.addEventListener('click', (event) => {
            event.preventDefault(); // Prevent the default link behavior
            toggleForms(signupForm, loginForm);
        });

        // Event listener for the "Log in" link
        showLoginLink.addEventListener('click', (event) => {
            event.preventDefault(); // Prevent the default link behavior
            toggleForms(loginForm, signupForm);
        });
    </script>

</body>
</html>
