<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Recipes</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <div class="page-header">
        <h1>Saved Recipes</h1>
        <a href="ownrecipes.html" class="add-recipe-button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Add New Recipe
        </a>
    </div>
    
    <div id="recipesList"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { firebaseConfig } from './cred.js';

  // Initialize Firebase and Firestore
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function deleteRecipe(docId, cardElement) {
    if (confirm('Are you sure you want to delete this recipe?')) {
      try {
        await deleteDoc(doc(db, "savedrecipes", docId));
        cardElement.style.transform = 'scale(0)';
        cardElement.style.opacity = '0';
        setTimeout(() => {
          cardElement.remove();
          // Check if no recipes left
          const remainingCards = document.querySelectorAll('.recipe-card');
          if (remainingCards.length === 0) {
            document.getElementById("recipesList").innerHTML = `
              <div class="empty-state">
                <p>No recipes found.</p>
                <a href="ownrecipes.html">Add Your First Recipe</a>
              </div>
            `;
          }
        }, 300);
      } catch (error) {
        console.error("Error deleting recipe: ", error);
        alert('Error deleting recipe. Please try again.');
      }
    }
  }

  async function fetchRecipes() {
    const recipesList = document.getElementById("recipesList");
    recipesList.innerHTML = "<p class='loading-text'>Loading recipes...</p>";

    try {
      const snapshot = await getDocs(collection(db, "savedrecipes"));
      console.log("Fetched", snapshot.size, "recipes");

      recipesList.innerHTML = "";

      if (snapshot.empty) {
        recipesList.innerHTML = `
          <div class="empty-state">
            <p>No recipes found.</p>
            <a href="ownrecipes.html">Add Your First Recipe</a>
          </div>
        `;
        return;
      }

      snapshot.forEach((doc) => {
        const recipe = doc.data();
        console.log("Recipe:", recipe);

        const card = document.createElement("div");
        card.classList.add("recipe-card");

        // Safe fallback for ingredients
        const ingredients = Array.isArray(recipe.ingredients)
          ? recipe.ingredients
          : typeof recipe.ingredients === "string"
          ? recipe.ingredients.split("\n").filter(i => i.trim())
          : [];

        card.innerHTML = `
          <div class="recipe-header">
            <h2>${recipe.dishName || "Untitled Dish"}</h2>
            <button class="delete-btn" onclick="deleteRecipe('${doc.id}', this.closest('.recipe-card'))">
              Delete
            </button>
          </div>
          <div class="recipe-content">
            <div class="recipe-meta">
              <p><strong>Category:</strong> ${recipe.category || "Uncategorized"}</p>
              <p><strong>Calories:</strong> ${recipe.calories || "N/A"}</p>
              <p><strong>Healthiness:</strong> ${recipe.healthiness || "Unknown"}</p>
              <p><strong>Prep Time:</strong> ${recipe.prepTime || "?"} mins</p>
            </div>
            <button class="toggle-btn" onclick="toggleRecipeDetails(this)">
              <span>Show Ingredients</span>
              <svg class="toggle-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6,9 12,15 18,9"></polyline>
              </svg>
            </button>
            <div class="recipe-details">
              <h3>Ingredients:</h3>
              <ul>${ingredients.length > 0 ? ingredients.map(i => `<li>${i}</li>`).join("") : '<li>No ingredients listed</li>'}</ul>
            </div>
          </div>
        `;

        recipesList.appendChild(card);
      });

      // Make deleteRecipe function globally accessible
      window.deleteRecipe = deleteRecipe;
      window.toggleRecipeDetails = toggleRecipeDetails;

    } catch (error) {
      console.error("Error fetching recipes: ", error);
      recipesList.innerHTML = "<p class='error-text'>Error loading recipes. Please check the console for details.</p>";
    }
  }

  function toggleRecipeDetails(button) {
    const recipeDetails = button.nextElementSibling;
    const buttonText = button.querySelector('span');
    const isExpanded = recipeDetails.classList.contains('expanded');
    
    if (isExpanded) {
      recipeDetails.classList.remove('expanded');
      button.classList.remove('expanded');
      buttonText.textContent = 'Show Ingredients';
    } else {
      recipeDetails.classList.add('expanded');
      button.classList.add('expanded');
      buttonText.textContent = 'Hide Ingredients';
    }
  }

  fetchRecipes();
</script>

</body>
</html>
